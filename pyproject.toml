[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "joguinho-em-python-apex-nexus"
version = "21.3.0"
description = "APEX NEXUS: jogo de grade por turnos para terminal, com API REST e console web opcionais."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vinicius Fernandes Lustosa"}]
keywords = ["python", "game", "terminal", "grid", "roguelike", "fastapi", "sqlite", "procedural-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Games/Entertainment",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.10"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
joguinho = "joguinho_apex.cli:main"
joguinho-api = "joguinho_apex.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/joguinho_apex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
